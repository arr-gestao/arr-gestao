<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#1a2c4e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ARR | Gestão de Colaboradores</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy:#1a2c4e; --navy2:#243a63; --orange:#f5890a; --orange2:#e07800;
      --white:#ffffff; --bg:#f4f6fb; --surface:#ffffff; --border:#e2e7f0;
      --text:#1a2c4e; --muted:#7a8aaa; --green:#22c55e; --red:#ef4444;
      --yellow:#f59e0b; --radius:12px; --shadow:0 2px 12px rgba(26,44,78,.09);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
    button{cursor:pointer;border:none;background:none;font-family:inherit;}
    input,select,textarea{font-family:inherit;}
    a{text-decoration:none;color:inherit;}

    /* LOADING */
    #app-loading{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:20px;}
    .loading-logo{display:flex;align-items:center;gap:14px;}
    .loading-logo-text h1{color:white;font-size:28px;font-weight:700;}
    .loading-logo-text p{color:rgba(255,255,255,.5);font-size:11px;letter-spacing:2px;text-transform:uppercase;}
    .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* LOGIN */
    #login-screen{display:none;min-height:100vh;background:linear-gradient(145deg,var(--navy),var(--navy2));align-items:center;justify-content:center;padding:24px;}
    .login-card{background:white;border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 24px 64px rgba(0,0,0,.25);}
    .login-logo{display:flex;align-items:center;gap:14px;margin-bottom:32px;justify-content:center;}
    .login-logo-text h1{font-size:26px;font-weight:700;color:var(--navy);}
    .login-logo-text p{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);}
    .login-title{font-size:18px;font-weight:600;margin-bottom:24px;color:var(--navy);}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
    .form-group input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;outline:none;transition:border-color .2s;}
    .form-group input:focus{border-color:var(--orange);}
    .btn-login{width:100%;padding:14px;background:var(--orange);color:white;border-radius:10px;font-size:15px;font-weight:600;margin-top:8px;transition:background .2s;}
    .btn-login:hover{background:var(--orange2);}
    .login-error{background:#fef2f2;color:var(--red);padding:10px 14px;border-radius:8px;font-size:13px;margin-top:12px;display:none;text-align:center;}

    /* APP SHELL */
    #app{display:none;height:100vh;flex-direction:column;}
    .topbar{background:var(--navy);color:white;padding:0 14px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.15);z-index:100;}
    .topbar-logo{display:flex;align-items:center;gap:10px;}
    .topbar-logo-text h2{font-size:15px;font-weight:700;color:white;}
    .topbar-logo-text p{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.5);}
    .topbar-right{display:flex;align-items:center;gap:10px;}
    .topbar-user{font-size:11px;color:rgba(255,255,255,.6);padding:4px 8px;background:rgba(255,255,255,.08);border-radius:6px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .btn-logout{padding:7px 14px;border:1.5px solid rgba(255,255,255,.25);border-radius:8px;color:rgba(255,255,255,.8);font-size:12px;font-weight:500;transition:all .2s;}
    .btn-logout:hover{border-color:white;color:white;}

    /* LAYOUT */
    .app-body{display:flex;flex:1;overflow:hidden;}
    .sidebar{width:240px;background:var(--navy);flex-shrink:0;display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto;}
    .main{flex:1;overflow-y:auto;padding:24px;}
    .nav-section-label{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1.5px;padding:12px 12px 6px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;color:rgba(255,255,255,.65);font-size:14px;font-weight:500;transition:all .15s;cursor:pointer;margin-bottom:2px;}
    .nav-item:hover{background:rgba(255,255,255,.08);color:white;}
    .nav-item.active{background:var(--orange);color:white;}
    .nav-item svg{width:18px;height:18px;flex-shrink:0;}
    .nav-item.admin-only{display:none;}

    /* MOBILE NAV */
    .mobile-nav{display:none;background:var(--navy);border-top:1px solid rgba(255,255,255,.1);padding:4px 0 6px;flex-shrink:0;}
    .mobile-nav-inner{display:flex;justify-content:space-around;}
    .mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 4px;color:rgba(255,255,255,.5);font-size:8px;font-weight:500;border-radius:8px;min-width:42px;transition:color .15s;cursor:pointer;}
    .mobile-nav-item svg{width:19px;height:19px;}
    .mobile-nav-item.active{color:var(--orange);}
    .mobile-nav-item.admin-only{display:none;}

    /* PAGE */
    .page-header{margin-bottom:24px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;}
    .page-header h1{font-size:22px;font-weight:700;color:var(--navy);}
    .page-header p{font-size:14px;color:var(--muted);margin-top:2px;}

    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;transition:all .15s;}
    .btn-primary{background:var(--orange);color:white;}
    .btn-primary:hover{background:var(--orange2);}
    .btn-secondary{background:var(--bg);color:var(--text);border:1.5px solid var(--border);}
    .btn-secondary:hover{background:var(--border);}
    .btn-danger{background:#fef2f2;color:var(--red);}
    .btn-danger:hover{background:#fee2e2;}
    .btn svg{width:15px;height:15px;}

    /* STATS */
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
    .stat-card{background:var(--surface);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow);border:1px solid var(--border);}
    .stat-card .stat-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
    .stat-card .stat-value{font-size:26px;font-weight:700;color:var(--navy);}
    .stat-card .stat-sub{font-size:12px;color:var(--muted);margin-top:4px;}
    .stat-card.accent{background:var(--orange);border-color:var(--orange);}
    .stat-card.accent .stat-label,.stat-card.accent .stat-sub{color:rgba(255,255,255,.75);}
    .stat-card.accent .stat-value{color:white;}

    /* TABLE */
    .table-wrap{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;}
    .table-toolbar{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--border);}
    .search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;min-width:180px;}
    .search-box svg{width:15px;height:15px;color:var(--muted);flex-shrink:0;}
    .search-box input{background:none;border:none;outline:none;font-size:13px;color:var(--text);width:100%;}
    table{width:100%;border-collapse:collapse;}
    th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;padding:10px 16px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg);}
    td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:var(--bg);}

    /* BADGES */
    .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
    .badge-green{background:#dcfce7;color:#16a34a;}
    .badge-red{background:#fef2f2;color:var(--red);}
    .badge-yellow{background:#fef9c3;color:#a16207;}
    .badge-blue{background:#dbeafe;color:#1d4ed8;}
    .badge-gray{background:#f3f4f6;color:#6b7280;}
    .badge-orange{background:#fff7ed;color:var(--orange2);}
    .badge-purple{background:#f3e8ff;color:#7c3aed;}

    /* MODAL */
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;}
    .modal-backdrop.open{display:flex;}
    .modal{background:white;border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.25);}
    .modal-header{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;}
    .modal-header h2{font-size:17px;font-weight:700;color:var(--navy);}
    .modal-close{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s;}
    .modal-close:hover{background:var(--bg);}
    .modal-body{padding:20px;}
    .modal-footer{padding:0 20px 20px;display:flex;gap:10px;justify-content:flex-end;}
    .field{margin-bottom:14px;}
    .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;}
    .field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;outline:none;transition:border-color .2s;}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);}
    .field textarea{resize:vertical;min-height:80px;}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

    /* MISC */
    .empty{text-align:center;padding:48px 24px;color:var(--muted);}
    .empty svg{width:48px;height:48px;margin:0 auto 12px;opacity:.3;display:block;}
    .colab-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;}
    .colab-avatar{width:44px;height:44px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:white;flex-shrink:0;}
    .colab-info{flex:1;}
    .colab-info h3{font-size:14px;font-weight:600;}
    .colab-info p{font-size:12px;color:var(--muted);margin-top:2px;}
    .obra-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:16px;margin-bottom:10px;}
    .obra-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
    .obra-card-header h3{font-size:15px;font-weight:600;color:var(--navy);}
    .obra-card-footer{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
    .diaria-item{background:var(--surface);border-radius:10px;border:1px solid var(--border);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
    .diaria-date{font-size:12px;font-weight:700;color:var(--navy);background:var(--bg);border-radius:8px;padding:6px 10px;text-align:center;min-width:52px;}
    .diaria-date small{display:block;font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;}
    .diaria-info{flex:1;}
    .diaria-info h4{font-size:13px;font-weight:600;}
    .diaria-info p{font-size:11px;color:var(--muted);margin-top:2px;}
    .month-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
    .month-chip{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;background:var(--bg);color:var(--muted);border:1.5px solid var(--border);cursor:pointer;transition:all .15s;}
    .month-chip.active{background:var(--orange);color:white;border-color:var(--orange);}
    .progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px;}
    .colab-rel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);}
    .colab-rel-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:background .15s;user-select:none;}
    .colab-rel-header:hover{background:var(--bg);}
    .colab-rel-avatar{width:40px;height:40px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:white;flex-shrink:0;}
    .colab-rel-info{flex:1;}
    .colab-rel-info h3{font-size:14px;font-weight:700;color:var(--navy);}
    .colab-rel-info p{font-size:12px;color:var(--muted);margin-top:2px;}
    .colab-rel-total{text-align:right;flex-shrink:0;}
    .colab-rel-total .valor{font-size:16px;font-weight:700;color:var(--orange2);}
    .colab-rel-total .sub{font-size:10px;color:var(--muted);margin-top:1px;}
    .colab-rel-chevron{font-size:16px;color:var(--muted);transition:transform .25s;flex-shrink:0;}
    .colab-rel-chevron.open{transform:rotate(180deg);}
    .colab-rel-body{display:none;border-top:1px solid var(--border);}
    .colab-rel-body.open{display:block;}
    .periodo-filter{display:flex;gap:4px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap;}
    .periodo-chip{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;background:white;color:var(--muted);border:1.5px solid var(--border);cursor:pointer;transition:all .15s;white-space:nowrap;}
    .periodo-chip.active{background:var(--orange);color:white;border-color:var(--orange);}
    .diaria-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);}
    .diaria-row:last-child{border-bottom:none;}
    .diaria-row-date{font-size:11px;font-weight:700;color:var(--navy);background:var(--bg);border-radius:6px;padding:4px 8px;text-align:center;min-width:44px;flex-shrink:0;}
    .diaria-row-obra{flex:1;font-size:12px;color:var(--text);}
    .diaria-row-obs{font-size:10px;color:var(--muted);}
    .diaria-row-val{font-size:13px;font-weight:700;color:var(--orange2);text-align:right;flex-shrink:0;}
    .presenca-toggle{display:flex;gap:0;border-radius:9px;overflow:hidden;border:1.5px solid var(--border);width:100%;}
    .valor-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;background:var(--bg);color:var(--muted);border:1px solid var(--border);}
    .valor-tag.fds{background:#fff7ed;color:var(--orange2);border-color:#fed7aa;}
    .valor-tag.extra{background:#f0fdf4;color:#16a34a;border-color:#86efac;}
    .presenca-btn{flex:1;padding:10px 8px;font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:all .15s;background:var(--bg);color:var(--muted);border:none;font-family:inherit;}
    .presenca-btn.presente.active{background:#dcfce7;color:#16a34a;}
    .presenca-btn.ausente.active{background:#fef2f2;color:var(--red);}
    .progress-fill{height:100%;background:var(--orange);border-radius:3px;transition:width .4s;}
    .section{display:none;}
    .section.active{display:block;}

    /* FILTRO USUÁRIO (admin) */
    .user-filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);}
    .user-filter-bar label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;white-space:nowrap;}
    .user-filter-bar select{padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:var(--bg);}
    .user-filter-bar select:focus{border-color:var(--orange);}

    /* TOAST */
    #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:white;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:all .3s;z-index:9999;white-space:nowrap;}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    /* RESPONSIVE */
    @media(max-width:768px){
      .sidebar{display:none;}
      .mobile-nav{display:block;}
      .main{padding:12px 10px;}
      .page-header h1{font-size:18px;}
      .stats-grid{grid-template-columns:1fr 1fr;gap:10px;}
      .stat-card{padding:14px 12px;}
      .stat-card .stat-value{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      th,td{padding:10px 12px;}
      .hide-mobile{display:none !important;}
      .table-toolbar{padding:10px 12px;}
      #toast{bottom:80px;max-width:calc(100vw - 32px);white-space:normal;text-align:center;}
      .field-row{grid-template-columns:1fr;}
    }
    @media(min-width:769px){.show-mobile-only{display:none !important;}}
  </style>
</head>
<body>

<!-- LOADING -->
<div id="app-loading">
  <div class="loading-logo">
    <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:48px;height:48px">
      <rect width="60" height="60" rx="12" fill="white"/>
      <polygon points="12,50 30,10 48,50" fill="none" stroke="#1a2c4e" stroke-width="4" stroke-linejoin="round"/>
      <polygon points="20,50 30,28 40,50" fill="#f5890a"/>
    </svg>
    <div class="loading-logo-text"><h1>ARR</h1><p>Projeto e Construções</p></div>
  </div>
  <div class="spinner"></div>
</div>

<!-- LOGIN -->
<div id="login-screen" style="display:none;min-height:100vh;background:linear-gradient(145deg,#1a2c4e,#243a63);align-items:center;justify-content:center;padding:24px;">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:52px;height:52px">
        <rect width="60" height="60" rx="12" fill="#1a2c4e"/>
        <polygon points="12,50 30,10 48,50" fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>
        <polygon points="20,50 30,28 40,50" fill="#f5890a"/>
      </svg>
      <div class="login-logo-text"><h1>ARR</h1><p>Projeto e Construções</p></div>
    </div>
    <p class="login-title">Acesso ao Sistema</p>
    <div class="form-group"><label>Usuário</label><input type="text" id="login-user" placeholder="seu usuário" autocomplete="username"/></div>
    <div class="form-group"><label>Senha</label><input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"/></div>
    <button class="btn-login" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error">Usuário ou senha incorretos.</div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;height:100vh;flex-direction:column;">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-logo">
      <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:32px;height:32px">
        <polygon points="12,50 30,10 48,50" fill="none" stroke="white" stroke-width="4" stroke-linejoin="round"/>
        <polygon points="20,50 30,28 40,50" fill="#f5890a"/>
      </svg>
      <div class="topbar-logo-text"><h2>ARR Gestão</h2><p>Colaboradores</p></div>
    </div>
    <div class="topbar-right">
      <span class="topbar-user" id="topbar-username"></
